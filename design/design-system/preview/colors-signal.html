<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_preview.css"></head><body><div class="card-wrap col" style="gap:14px">
  <div class="row" style="gap:14px;align-items:center">
    <div style="width:64px;height:64px;border-radius:10px;background:var(--signal);position:relative;box-shadow:0 0 40px var(--signal-soft)"></div>
    <div class="col" style="gap:2px">
      <div class="name">signal · #f0b878</div>
      <div class="muted" style="max-width:340px">warm amber. the one saturated chrome color. used only for the mic-active dot and the hero waveform glow — never on text or buttons.</div>
    </div>
  </div>
  <div class="row" style="gap:10px">
    <div class="row" style="gap:6px;align-items:center"><div style="width:14px;height:14px;border-radius:7px;background:var(--ok)"></div><span class="t-body-sm">ok</span><span class="hex">#6fcf9c</span></div>
    <div class="row" style="gap:6px;align-items:center;margin-left:14px"><div style="width:14px;height:14px;border-radius:7px;background:var(--err)"></div><span class="t-body-sm">err</span><span class="hex">#ff7a7a</span></div>
    <div class="row" style="gap:6px;align-items:center;margin-left:14px"><div style="width:14px;height:14px;border-radius:7px;background:var(--info)"></div><span class="t-body-sm">info</span><span class="hex">#7ec0ff</span></div>
  </div>
</div></body></html>
