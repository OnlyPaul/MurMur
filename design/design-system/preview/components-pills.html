<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_preview.css"></head><body><div class="card-wrap col" style="gap:14px">
  <div class="row" style="gap:6px;align-items:center;flex-wrap:wrap">
    <span style="background:var(--surface-elevated);color:var(--on-dark);font:500 13px/1 var(--font-sans);padding:6px 12px;border-radius:9999px">all</span>
    <span style="color:var(--body);font:400 13px/1 var(--font-sans);padding:6px 12px;border-radius:9999px">recent</span>
    <span style="color:var(--body);font:400 13px/1 var(--font-sans);padding:6px 12px;border-radius:9999px">favorites</span>
    <span style="color:var(--body);font:400 13px/1 var(--font-sans);padding:6px 12px;border-radius:9999px">by language</span>
  </div>
  <div class="row" style="gap:8px;align-items:center">
    <span style="background:var(--surface-elevated);color:var(--on-dark-mute);font:500 11px/1 var(--font-sans);padding:3px 7px;border-radius:4px;letter-spacing:0.4px;text-transform:uppercase">pro</span>
    <span style="background:var(--signal-soft);color:var(--signal);font:500 11px/1 var(--font-sans);padding:3px 7px;border-radius:4px;letter-spacing:0.4px;text-transform:uppercase">listening</span>
    <span style="background:var(--ok-soft);color:var(--ok);font:500 11px/1 var(--font-sans);padding:3px 7px;border-radius:4px;letter-spacing:0.4px;text-transform:uppercase">ready</span>
    <span style="background:var(--err-soft);color:var(--err);font:500 11px/1 var(--font-sans);padding:3px 7px;border-radius:4px;letter-spacing:0.4px;text-transform:uppercase">no mic</span>
  </div>
</div></body></html>
